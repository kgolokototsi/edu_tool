<!DOCTYPE html>
<html lang="en" data-theme="purple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Oa's Edu Tool</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b2a9e">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --font:"Baloo 2","Chalkboard SE","Comic Neue","Comic Sans MS","Marker Felt","Trebuchet MS",system-ui,sans-serif;
  --ink:#241a3a; --accent:#ffc93c; --accent-d:#d9a000; --coral:#ff6b6b; --good:#2fbf71;
  --c1:#5b2a9e; --c2:#8e4fe0; --c3:#efe3ff;
}
:root[data-theme="purple"]{--c1:#5b2a9e;--c2:#8e4fe0;--c3:#efe3ff}
:root[data-theme="teal"]{--c1:#0b6f6a;--c2:#17b3a8;--c3:#d9faf6}
:root[data-theme="blue"]{--c1:#1f56b8;--c2:#3b8dff;--c3:#e0eeff}
:root[data-theme="green"]{--c1:#2b7a30;--c2:#4cc552;--c3:#e2f8e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:var(--font);color:var(--ink);touch-action:manipulation}
body{
  background:
    radial-gradient(circle at 8% 12%,rgba(255,255,255,.20) 0 70px,transparent 71px),
    radial-gradient(circle at 92% 30%,rgba(255,255,255,.14) 0 110px,transparent 111px),
    radial-gradient(circle at 20% 90%,rgba(255,255,255,.16) 0 90px,transparent 91px),
    radial-gradient(circle at 80% 88%,rgba(255,255,255,.12) 0 60px,transparent 61px),
    linear-gradient(160deg,var(--c2),var(--c1));
}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(0,0,0,.2);flex:0 0 auto}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:#fff;font-size:clamp(20px,3vw,30px);font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo svg{width:46px;height:52px;background:var(--c3);border-radius:50%;border:3px solid #fff}
.spacer{flex:1}
.chip{color:var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;border:3px solid var(--c1);font-size:clamp(16px,2.4vw,22px);white-space:nowrap}
.ib{width:54px;height:54px;border-radius:50%;border:3px solid var(--c1);background:var(--accent);font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.25);padding:0}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;-webkit-overflow-scrolling:touch;min-height:0}
.card{background:#fff;border:4px solid var(--c1);border-radius:28px;padding:18px;box-shadow:0 7px 0 rgba(0,0,0,.2)}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:10px 26px;border-radius:22px;border:4px solid var(--c1);background:var(--accent);font-size:clamp(20px,3vw,28px);font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn:active,.big:active,.opt:active,.key:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.alt{background:#fff}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
h1,h2{margin:0 0 10px;font-weight:900}
h2{font-size:clamp(26px,4vw,40px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sub{color:#fff;font-weight:800;font-size:clamp(16px,2.4vw,22px);text-shadow:0 2px 0 rgba(0,0,0,.2)}

/* Home */
.home{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.2fr);gap:20px;align-items:center;max-width:1100px;margin:0 auto;min-height:100%}
@media (orientation:portrait),(max-width:760px){.home{grid-template-columns:1fr}}
.hero{text-align:center;color:#fff}
.hero .fig{height:min(54vh,430px);width:auto;margin:0 auto;animation:bob 2.4s ease-in-out infinite}
.hero .fig svg{height:100%;width:auto;margin:0 auto}
.hero .fig svg,.fig svg{display:block;filter:drop-shadow(0 8px 0 rgba(0,0,0,.2))}
.hello{font-size:clamp(28px,5vw,52px);font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.25);margin:6px 0}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.menu{display:flex;flex-direction:column;gap:18px}
.big{display:flex;align-items:center;gap:18px;padding:16px 24px;border-radius:30px;border:4px solid var(--c1);background:var(--bc,var(--accent));font-size:clamp(26px,4vw,40px);font-weight:900;box-shadow:0 9px 0 rgba(0,0,0,.25);text-align:left;min-height:96px;width:100%}
.big small{display:block;font-size:.5em;font-weight:800;opacity:.85}
.big .ic{font-size:1.5em}
.big[disabled]{filter:grayscale(.7);opacity:.75}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes floatup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}

/* Hubs */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;max-width:1100px;margin:14px auto 0}
.tcard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:16px;border-radius:26px;border:4px solid var(--c1);background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.22);min-height:150px;width:100%}
.tcard:active{transform:translateY(4px)}
.tcard .ti{font-size:46px;line-height:1}
.tcard .tn{font-size:clamp(20px,2.6vw,26px);font-weight:900}
.tcard .td{font-size:16px;font-weight:700;opacity:.75}
.tcard.lock{background:#e9e5f0;filter:grayscale(.9);opacity:.8}
.star{color:#ffb800;font-size:26px;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.star .off{color:#d4cfdc;text-shadow:none}
.head{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.back{min-height:54px;padding:6px 20px;font-size:22px}

/* Quiz */
.quiz{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:12px;color:#fff;font-weight:900;font-size:clamp(16px,2.4vw,22px)}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff}
.dots i.done{background:var(--accent)}
.dots i.cur{background:#fff;transform:scale(1.25)}
.qcard{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:200px}
.qtext{font-size:clamp(34px,6.4vw,64px);font-weight:900;text-align:center;line-height:1.25}
.slot{display:inline-flex;min-width:1.7em;height:1.3em;padding:0 .25em;align-items:center;justify-content:center;border:4px dashed var(--c2);border-radius:16px;background:var(--c3);vertical-align:middle;margin:0 .1em}
.slot.ok{border-style:solid;border-color:var(--good);background:#c4f6d4}
.slot.bad{border-color:var(--coral);background:#ffd2d2;animation:shake .4s}
.slot.over{background:var(--accent)}
.objs{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(26px,5vw,42px);line-height:1.15}
.objs .r{display:flex;gap:6px;justify-content:center}
.objs .gone{opacity:.28;text-decoration:line-through;filter:grayscale(1)}
.vis{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center}
.vis .plus{font-size:clamp(30px,5vw,48px);font-weight:900}
.grp{border:3px dashed var(--c2);border-radius:20px;padding:6px 10px;background:var(--c3);display:flex;flex-direction:column;align-items:center}
.bigpic{font-size:clamp(50px,9vw,84px)}
.qsay{font-size:clamp(20px,3vw,28px);font-weight:800;text-align:center;line-height:1.35;max-width:760px;cursor:pointer}
.ncard{font-size:60px;font-size:clamp(44px,8vw,80px);font-weight:900;background:#fff;border:4px solid var(--c1);border-radius:22px;padding:2px 26px;min-width:1.6em;text-align:center}
.shape{width:110px;width:clamp(80px,15vw,130px);height:auto}
.shapes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.shapes .shape{width:60px;width:clamp(46px,8.5vw,72px)}
.clock{width:210px;width:clamp(170px,30vw,250px);height:auto}
.coin{height:auto}
.note{width:140px;width:clamp(110px,20vw,160px);height:auto}
.pv{--u:18px;display:flex;gap:10px;align-items:flex-end}
.pv .ten{width:var(--u);height:calc(var(--u)*10);border-radius:3px;box-shadow:0 0 0 2px #174a8c;background:repeating-linear-gradient(#2f8cff 0,#2f8cff calc(var(--u) - 2px),#174a8c calc(var(--u) - 2px),#174a8c var(--u))}
.pv .ones{display:flex;flex-direction:column-reverse;gap:3px}
.pv .one{width:var(--u);height:calc(var(--u) - 3px);border-radius:3px;background:#ff9248;box-shadow:0 0 0 2px #9c4a12}
.sgrp{display:flex;flex-direction:column;align-items:center;gap:4px}
.sfig{height:120px;height:clamp(90px,16vw,140px)}
.sfig svg{height:100%;width:auto}
.hint{background:#fff7d1;border:3px solid var(--accent-d);border-radius:18px;padding:8px 16px;font-weight:800;font-size:clamp(17px,2.4vw,22px);text-align:center;animation:pop .3s}
.coach{display:flex;align-items:center;gap:12px}
.coach .fig{height:clamp(84px,15vh,130px);width:auto;flex:0 0 auto}
.coach .fig svg{height:100%;width:auto}
.fig svg{display:block}
.bubble{color:var(--ink);background:#fff;border:4px solid var(--c1);border-radius:24px;padding:10px 18px;font-size:clamp(19px,2.8vw,28px);font-weight:900;flex:1;min-height:60px;display:flex;align-items:center;position:relative}
.bubble:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--c1);border-left:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.opt,.dcard{font-size:clamp(30px,5vw,52px);font-weight:900;min-height:84px;border-radius:24px;border:4px solid var(--c1);background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;padding:6px 10px}
.opt.wrong{background:#ffd2d2;opacity:.6;animation:shake .4s}
.dcard{touch-action:none;cursor:grab;background:var(--accent);position:relative}
.dcard.dragging{z-index:60;transition:none;box-shadow:0 18px 20px rgba(0,0,0,.3)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:720px;margin:0 auto;width:100%}
.key{min-height:70px;border-radius:20px;border:4px solid var(--c1);background:#fff;font-size:34px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.22);padding:0}
.key.go{background:var(--good);color:#fff}
.key.del{background:#ffe0e0}
.kb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:820px;margin:0 auto}
.kb .key{width:clamp(44px,8.4vw,72px);min-height:62px;font-size:28px}
.kb .key.wide{width:clamp(90px,16vw,140px)}
.baskets{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.basket{min-width:150px;min-height:110px;max-width:260px;border:4px dashed var(--c2);background:var(--c3);border-radius:22px 22px 44px 44px;display:flex;flex-wrap:wrap;gap:2px;padding:8px;justify-content:center;align-content:flex-start;position:relative;font-size:38px}
.basket:after{content:"\1F9FA";position:absolute;right:6px;bottom:-4px;font-size:30px;opacity:.5}
.basket.over{background:var(--accent)}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:64px;padding:10px;border-radius:20px;background:rgba(255,255,255,.55);border:3px dashed #fff}
.it{font-size:46px;line-height:1;touch-action:none;cursor:grab;padding:2px;position:relative}
.it.dragging{z-index:60;filter:drop-shadow(0 10px 8px rgba(0,0,0,.3))}

/* Result */
.result{max-width:700px;margin:10px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .fig{height:min(34vh,260px);width:auto}
.result .fig svg{height:100%;width:auto;margin:0 auto}
.result .big-n{font-size:clamp(46px,9vw,80px);font-weight:900;color:var(--c1);line-height:1}
.line{font-size:clamp(18px,2.8vw,26px);font-weight:800}
.newhi{background:var(--accent);border:4px solid var(--c1);border-radius:999px;padding:6px 20px;font-weight:900;font-size:clamp(20px,3vw,30px);animation:pop .5s}
.wchip{display:inline-block;background:var(--c3);border:3px solid var(--c2);border-radius:16px;padding:4px 14px;margin:4px;font-weight:900;font-size:clamp(20px,3vw,28px)}

/* Reader */
.reader{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.scene{height:min(44vh,380px);min-height:180px;border-radius:30px;border:4px solid var(--c1);display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,28px);font-size:clamp(72px,15vw,150px);box-shadow:0 7px 0 rgba(0,0,0,.2);overflow:hidden;padding:0 10px}
.scene span{animation:pop .45s backwards}
.scene svg{height:clamp(140px,28vh,290px);width:auto;display:block}
.scene .pen{height:clamp(90px,18vh,170px)}
.ptext{font-size:clamp(30px,5.2vw,58px);font-weight:900;line-height:1.35;text-align:center}
.w{display:inline-block;padding:0 .12em;border-radius:14px;cursor:pointer}
.w.nw{background:var(--accent);box-shadow:0 3px 0 var(--accent-d)}
.w:active{background:var(--c3)}
.bookcover{font-size:56px;line-height:1;display:flex;gap:6px}
.lvl{display:inline-block;background:var(--c3);border:3px solid var(--c2);border-radius:999px;padding:0 12px;font-weight:900;font-size:16px}

/* Arcade */
.arcade{height:100%;display:flex;flex-direction:column;gap:8px;max-width:980px;margin:0 auto}
.hud{display:flex;align-items:center;gap:10px}
.hud .chip{font-size:clamp(18px,2.6vw,26px)}
.timebar{flex:1;height:22px;border-radius:999px;background:rgba(255,255,255,.4);border:3px solid #fff;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
#arena{position:relative;flex:1;min-height:200px;border:4px solid var(--c1);border-radius:26px;overflow:hidden;background:linear-gradient(#7fd0ff,#dff6ff);touch-action:none}
#arena.shake{animation:shake .3s}
.cloud{position:absolute;font-size:64px;opacity:.9}
.ground{position:absolute;left:0;right:0;bottom:0;height:7%;background:#6fd16a;border-top:5px solid #3fa24a}
.item{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;will-change:transform;pointer-events:none}
.item svg{width:100%;height:100%}
#player{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
#player svg{width:100%;height:auto;display:block}
.pts{position:absolute;font-weight:900;font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5);animation:floatup .8s forwards;pointer-events:none;white-space:nowrap}
.pts.bad{color:#ff5d5d}
.ctl{display:flex;gap:14px;justify-content:center}
.ctl .btn{flex:1;max-width:260px;min-height:70px;font-size:36px;touch-action:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:clamp(34px,6vw,54px);align-items:center}
.legend svg{width:1.1em;height:1.1em}
.tag{display:inline-block;font-weight:900;border-radius:999px;padding:2px 14px;font-size:clamp(16px,2.4vw,22px);color:#fff}
.tag.g{background:var(--good)} .tag.b{background:var(--coral)}
.gamedlg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,10,40,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.dlgcard{max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:pop .3s}
.swatches{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.sw{width:clamp(110px,22vw,150px);height:clamp(110px,22vw,150px);border-radius:30px;border:5px solid #fff;font-size:22px;font-weight:900;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.sw:active{transform:translateY(4px)}
.sw.purple{background:#8e4fe0}.sw.teal{background:#17b3a8}.sw.blue{background:#3b8dff}.sw.green{background:#4cc552}
input.num{font-size:34px;width:140px;text-align:center;border:4px solid var(--c1);border-radius:16px;padding:8px;font-family:inherit;-webkit-user-select:text;user-select:text}
.toggle{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
.toggle input{width:32px;height:32px}

/* Games */
.pen{height:100%;display:flex;flex-direction:column;gap:8px;max-width:980px;margin:0 auto}
#pitch{position:relative;flex:1;min-height:260px;border:4px solid var(--c1);border-radius:26px;overflow:hidden;background:linear-gradient(#78c8ff 0 20%,#46b34b 20% 100%);touch-action:none}
#pitch:before{content:"";position:absolute;top:20%;left:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 12%,transparent 12% 24%)}
#goal{position:absolute;left:14%;right:14%;top:10%;height:40%;border:8px solid #fff;border-bottom:0;border-radius:8px 8px 0 0;background:rgba(40,40,60,.28)}
#goal .net{position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 15px),repeating-linear-gradient(-45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 15px)}
#keeper{position:absolute;left:50%;bottom:0;height:64%;transform:translateX(-50%);transform-origin:50% 100%;transition:transform .4s cubic-bezier(.2,.8,.3,1)}
#keeper svg{height:100%;width:auto;display:block}
#pOa{position:absolute;left:30%;top:56%;height:38%;transform:translateX(-50%);transition:transform .25s}
#pOa.kick{transform:translateX(-30%) translateY(-4%)}
#pOa svg{height:100%;width:auto;display:block}
#ball{position:absolute;width:11%;max-width:80px;min-width:38px;left:56%;top:82%;transform:translate(-50%,-50%);transition:left .6s ease-out,top .6s cubic-bezier(.15,.8,.3,1),transform .6s ease-out}
#ball svg{width:100%;height:auto;display:block}
#pmsg{position:absolute;left:0;right:0;top:1%;text-align:center;font-size:clamp(30px,6.4vw,60px);font-weight:900;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.45);opacity:0;transform:scale(.6);pointer-events:none}
#pmsg.show{opacity:1;transform:scale(1);transition:all .25s}
#pmsg.bad{color:#ffd0d0}
#tboard{width:min(92vw,58vh);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px auto}
.cell{height:calc((min(92vw,58vh) - 20px)/3);border-radius:24px;border:4px solid var(--c1);background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.22);font-size:clamp(46px,13vw,100px);display:flex;align-items:center;justify-content:center;padding:0}
.cell:active{transform:translateY(4px)}
.cell.win{background:var(--accent);animation:pop .5s}
/* Newer games: every size is set in px from JS, so they work on older tablet browsers without min()/clamp() */
.garea{position:relative;flex:1;min-height:260px;border:4px solid var(--c1);border-radius:26px;overflow:hidden;touch-action:none}
.garea.grass{background:linear-gradient(#9fdcff 0,#dff4ff 82%,#46b34b 82%,#46b34b 100%)}
.garea.pitch{background:repeating-linear-gradient(90deg,#4cb84f 0,#4cb84f 80px,#45ad48 80px,#45ad48 160px)}
.pcard{position:absolute;border-radius:16px;border:4px solid var(--c1);background:var(--c2);box-shadow:0 5px 0 rgba(0,0,0,.22);overflow:hidden;transition:transform .15s}
.pcard.flip{transform:scaleX(0)}
.pcard.up{background:#fff}
.pcard.done{background:#fff7c2;border-color:var(--good)}
.pcard .back{height:100%;display:flex;align-items:center;justify-content:center;font-size:2.6em}

<body>
<div id="app">
  <div class="bar" id="bar"></div>

<script>
'use strict';
/* =========================================================
   Oa's Edu Tool: single file, works offline from file://
   Sections: CONFIG, Storage, Sound, Art, Maths generators,
   Books, Round engine, Screens, Arcade, Boot
   ========================================================= */

/* ---------- CONFIG ---------- */
const CONFIG = {
  character: { skin:'#c99467', hair:'#15110f', trim:'#0f4f3a' },
  tokenCost: 50,       // points for one arcade token
  roundLen: 10,        // questions in a maths round
  arcadeSeconds: 75,
  bookBonus: 20,
  money: { sym:'R', word:'rand', coins:[1,2,5], notes:[10,20] }  // Money topic: South African rand
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Storage ---------- */
const KEY = 'eduTool.oa.v1';
const DEF = { theme:null, points:0, spent:0, best:0, arcadeBest:0, hist:{}, stats:{}, booksDone:{}, words:[], mute:false, unlockAll:false, penBest:0, ttt:{w:0,d:0,l:0}, pairsBest:{easy:0,tricky:0,genius:0}, keepyBest:0, redBest:0, simonBest:0 };
let S = (()=>{ try{ const r=localStorage.getItem(KEY); if(r) return Object.assign(clone(DEF),JSON.parse(r)); }catch(e){} return clone(DEF); })();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const tokens = () => Math.max(0, Math.floor(S.points/CONFIG.tokenCost) - S.spent);

/* ---------- Sound: everything synthesised with WebAudio, no audio files ---------- */
const hz = s => 261.63*Math.pow(2,s/12);            // s = semitones above middle C
const bars = (...b) => [].concat(...b);
function track(bpm,len,voices){
  const events=[];
  voices.forEach(v=>{ let b=0; v.notes.forEach(([s,d])=>{ if(s!==null) events.push({b,s,d,w:v.w,v:v.v}); b+=d; }); });
  events.sort((x,y)=>x.b-y.b);
  return {bpm,len,events};
}
const TRACKS = {
  // bright C-major jingle, 8 bars of 4 beats
  jingle: track(126,32,[
    { w:'square', v:.055, notes:[
      [4,1],[7,1],[12,1],[7,1],  [9,1],[12,1],[16,1],[12,1],
      [5,1],[9,1],[12,1],[9,1],  [7,1],[11,1],[14,2],
      [4,1],[7,1],[12,1],[16,1], [14,1],[12,1],[9,1],[7,1],
      [5,1],[7,1],[9,1],[11,1],  [12,2],[7,1],[12,1] ]},
    { w:'triangle', v:.2, notes:[
      [-12,1],[-5,1],[-12,1],[-5,1], [-3,1],[4,1],[-3,1],[4,1],
      [-7,1],[0,1],[-7,1],[0,1],     [-5,1],[2,1],[-5,1],[2,1],
      [-12,1],[-5,1],[-12,1],[-5,1], [-5,1],[2,1],[-5,1],[2,1],
      [-7,1],[0,1],[-7,1],[0,1],     [-12,2],[-5,1],[-12,1] ]}
  ]),
  // faster, adventurous loop for the arcade
  arcade: (()=>{
    const a=[[9,.5],[12,.5],[16,.5],[12,.5],[9,.5],[12,.5],[16,1]];
    const f=[[5,.5],[9,.5],[12,.5],[9,.5],[5,.5],[9,.5],[12,1]];
    const g=[[7,.5],[11,.5],[14,.5],[11,.5],[7,.5],[11,.5],[14,1]];
    const e=[[4,.5],[8,.5],[11,.5],[8,.5],[4,.5],[8,.5],[11,1]];
    const bs=r=>[[r,1],[r+12,1],[r,1],[r+12,1]];
    return track(152,32,[
      { w:'square', v:.05, notes:bars(a,f,g,e,a,f,g,e) },
      { w:'triangle', v:.22, notes:bars(bs(-15),bs(-19),bs(-17),bs(-20),bs(-15),bs(-19),bs(-17),bs(-20)) }
    ]);
  })()
};
const Snd = {
  ctx:null, master:null, timer:null, track:null, name:null, loopStart:0, i:0, loops:0,
  init(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = S.mute ? 0 : .5;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx=null; }
  },
  resume(){ this.init(); if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMute(m){ S.mute=m; save(); if(this.master) this.master.gain.value = m ? 0 : .5; },
  tone(f,t,d,type='triangle',vol=.2){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(d,.05));
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+Math.max(d,.05)+.05);
  },
  sweep(f1,f2,t,d,type='sawtooth',vol=.15){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+.05);
  },
  start(name){
    if(!this.ctx) return;
    if(this.name===name && this.timer) return;
    this.stop();
    this.name=name; this.track=TRACKS[name]; this.loopStart=this.ctx.currentTime+.1; this.i=0; this.loops=0;
    this.timer=setInterval(()=>this.pump(),80);
  },
  stop(){ if(this.timer) clearInterval(this.timer); this.timer=null; this.name=null; this.track=null; },
  pump(){
    const c=this.ctx, tr=this.track; if(!c||!tr||c.state!=='running') return;
    const spb=60/tr.bpm;
    for(let guard=0; guard<200; guard++){
      const ev=tr.events[this.i];
      const t=this.loopStart+(this.loops*tr.len+ev.b)*spb;
      if(t>c.currentTime+.25) break;
      if(t>=c.currentTime-.05) this.tone(hz(ev.s),Math.max(t,c.currentTime),ev.d*spb*.95,ev.w,ev.v);
      if(++this.i>=tr.events.length){ this.i=0; this.loops++; }
    }
  },
  play(name){
    if(!this.ctx) return; const t=this.ctx.currentTime+.01;
    const seq=(arr,gap,type,dur,vol)=>arr.forEach((s,i)=>this.tone(hz(s),t+i*gap,dur,type,vol));
    switch(name){
      case 'click': this.tone(hz(19),t,.06,'square',.05); break;
      case 'good': seq([16,19,24],.07,'triangle',.22,.26); break;
      case 'ok': seq([12,16,19],.08,'triangle',.22,.24); break;
      case 'no': this.sweep(330,170,t,.3,'square',.1); break;
      case 'coin': seq([23,28],.07,'square',.12,.09); break;
      case 'low': seq([12,16],.06,'triangle',.16,.22); break;
      case 'pen': seq([12,16,19,24,28],.06,'triangle',.25,.26); break;
      case 'hit': this.sweep(240,60,t,.4,'sawtooth',.2); break;
      case 'win': seq([12,16,19,24,19,24,28],.11,'square',.3,.1); seq([0,7],.33,'triangle',.5,.25); break;
      case 'kick': this.sweep(260,70,t,.18,'square',.22); break;
      case 'goal': seq([12,16,19,24],.09,'square',.2,.1); seq([0,7,12],.1,'triangle',.4,.22); break;
      case 'lose': seq([12,9,5,0],.15,'triangle',.3,.2); break;
      case 'p0': case 'p1': case 'p2': case 'p3': this.tone(hz([7,12,16,19][+name[1]]),t,.4,'triangle',.32); break;
    }
  },
  ensure(){ this.resume(); if(this.ctx && !this.timer && tune()) this.start(tune()); }
};
let arcade=null; // arcade run state (also used above to pick the music)
const tune = () => cur==='simon' ? null : ['arcade','pen','keepy','red'].includes(cur) ? 'arcade' : 'jingle'; // null: quiet, so the pad notes can be heard

/* ---------- Art: cartoon SVG ---------- */
const penSVG = () => `<svg viewBox="0 0 100 100" class="pen" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-35 50 50)">
  <rect x="12" y="40" width="62" height="20" rx="8" fill="#fff" stroke="#222" stroke-width="4"/>
  <rect x="12" y="40" width="24" height="20" rx="8" fill="#2f8cff" stroke="#222" stroke-width="4"/>
  <rect x="44" y="46" width="20" height="8" rx="3" fill="#ff6b6b"/>
  <rect x="74" y="44" width="10" height="12" fill="#cfd8e3" stroke="#222" stroke-width="3"/>
  <path d="M84 50 H97" stroke="#222" stroke-width="3.5" stroke-linecap="round"/></g></svg>`;
const coinSVG = () => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="#ffc93c" stroke="#222" stroke-width="5"/><circle cx="50" cy="50" r="28" fill="none" stroke="#e29d00" stroke-width="5"/><path d="M50 30 L56 45 L72 46 L59 56 L64 71 L50 62 L36 71 L41 56 L28 46 L44 45Z" fill="#fff3b0" stroke="#e29d00" stroke-width="3" stroke-linejoin="round"/></svg>`;
const figHTML = (mood='happy', cls='') => `<div class="fig ${cls}">${oa(mood)}</div>`;

/* ---------- Maths: generators ---------- */
const OBJ = ['🍎','⭐','⚽','🐟','🚗','🎈','🐥','🌸','🏀','🦋'];
const OBJ2 = ['🔵','🟠','🟢','🟣'];
function objs(n,e,gone=0){
  let h='<div class="objs">';
  for(let i=0;i<n;i+=5){
    h+='<div class="r">';
    for(let j=i;j<Math.min(n,i+5);j++) h+=`<span class="${j>=n-gone?'gone':''}">${e}</span>`;
    h+='</div>';
  }
  return h+'</div>';
}
const grp = (g,p,e) => `<div class="vis">${Array.from({length:g},()=>`<div class="grp">${objs(p,e)}</div>`).join('')}</div>`;
function numOpts(ans,n=4,extra=[]){
  const set=new Set([ans]);
  const first=shuffle([1,-1,2,-2].concat(extra)), later=[3,-3,10,-10,5,-5];
  for(const d of first.concat(later)){ if(set.size>=n) break; const v=ans+d; if(v>=0) set.add(v); }
  let k=1; while(set.size<n) set.add(ans+k++);
  return shuffle([...set]).map(String);
}
const seqText = (seq,i) => seq.map((v,j)=>j===i?'{{slot}}':v).join(', ');
const ncard = v => `<span class="ncard">${v}</span>`;
const NAMED = [['apples','🍎'],['stars','⭐'],['balls','⚽'],['fish','🐟'],['cars','🚗'],['balloons','🎈'],['oranges','🍊'],['medals','🏅']];
const SHAPES = {triangle:3, square:4, rectangle:4, pentagon:5, hexagon:6, circle:0};
const SHAPE_COL = ['#ff6b6b','#2f8cff','#ffc93c','#3ccf7a','#a66bff','#ff9248'];
function shapeSVG(name,col){
  const k=SHAPES[name], st=`fill="${col}" stroke="#222" stroke-width="4" stroke-linejoin="round"`;
  const body = name==='circle' ? `<circle cx="50" cy="50" r="42" ${st}/>`
    : name==='square' ? `<rect x="12" y="12" width="76" height="76" ${st}/>`
    : name==='rectangle' ? `<rect x="4" y="26" width="92" height="48" ${st}/>`
    : `<polygon points="${Array.from({length:k},(_,i)=>{ const a=2*Math.PI*i/k-Math.PI/2, cy={3:62,6:50}[k]||54, r=k===6?44:46; return (50+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1); }).join(' ')}" ${st}/>`;
  return `<svg class="shape" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}
function clockSVG(h,m){
  const pt=(deg,r)=>{ const a=(deg-90)*Math.PI/180; return [(50+r*Math.cos(a)).toFixed(1),(50+r*Math.sin(a)).toFixed(1)]; };
  const hand=(deg,r,w,col)=>{ const [x,y]=pt(deg,r); return `<line x1="50" y1="50" x2="${x}" y2="${y}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; };
  const nums=Array.from({length:12},(_,i)=>{ const [x,y]=pt((i+1)*30,36); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="900" fill="#222">${i+1}</text>`; }).join('');
  return `<svg class="clock" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#222" stroke-width="4"/>${nums}
    ${hand((h%12)*30+m/2,21,6,'#2f8cff')}${hand(m*6,33,3.5,'#ff6b6b')}<circle cx="50" cy="50" r="3.5" fill="#222"/></svg>`;
}
function moneySVG(v){
  const sym=CONFIG.money.sym, lbl=`text-anchor="middle" dominant-baseline="central" font-weight="900" fill="#222"`;
  if(CONFIG.money.notes.includes(v)) return `<svg class="note" viewBox="0 0 160 80" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="154" height="74" rx="8" fill="${v>10?'#e9a35a':'#7cc47f'}" stroke="#222" stroke-width="4"/><circle cx="120" cy="40" r="24" fill="#fff" opacity=".45"/><text x="55" y="42" font-size="34" ${lbl}>${sym}${v}</text></svg>`;
  const gold=v===Math.max.apply(null,CONFIG.money.coins), w=[.8,.9,1][CONFIG.money.coins.indexOf(v)]||1;
  return `<svg class="coin" style="width:${Math.round(70*w)}px;width:calc(clamp(54px,10vw,80px)*${w})" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="${gold?'#ffc93c':'#d9dee5'}" stroke="#222" stroke-width="5"/><circle cx="50" cy="50" r="34" fill="none" stroke="${gold?'#e29d00':'#9aa3ad'}" stroke-width="4"/><text x="50" y="52" font-size="${String(sym).length>1?24:32}" ${lbl}>${sym}${v}</text></svg>`;
}
function blocks(n){
  const t=Math.floor(n/10), o=n%10;
  return `<div class="pv">${'<div class="ten"></div>'.repeat(t)}<div class="ones">${'<div class="one"></div>'.repeat(o)}</div></div>`;
}
const STORY_CAST = ['oa','shakes','matador','tiger','bo','joe','rasta','klaus'];
const castName = id => id==='oa' ? 'Oa' : PLAYERS[id].n;
const castFig = id => `<div class="sfig">${id==='oa'?oa('happy'):player(id)}</div>`;
const castWith = (id,n,e,gone) => `<div class="sgrp">${castFig(id)}${objs(n,e,gone)}</div>`;
const clock12 = h => ((h-1)%12+12)%12+1;
const GEN = {
  count(d){
    const e=pick(OBJ), t=pick(['count','count','groups','share','basket']);
    if(t==='count'){ const n=rnd(2,d?20:10);
      return {text:'How many? {{slot}}', vis:objs(n,e), ans:n, hint:'Touch each one and count: 1, 2, 3…'}; }
    if(t==='groups'){ const p=pick([2,5]), g=rnd(2,p===2?5:3);
      return {text:'How many altogether? {{slot}}', vis:grp(g,p,e), ans:g*p, hint:`There are ${g} groups of ${p}. Count in ${p}s: ${Array.from({length:g},(_,i)=>(i+1)*p).join(', ')}`}; }
    if(t==='share'){ const p=pick([2,5]), g=rnd(2,p===2?5:3);
      return {text:`Groups of ${p}. How many groups? {{slot}}`, vis:objs(g*p,e), ans:g, hint:`Put them in groups of ${p} and count the groups.`}; }
    const g=rnd(2,4), p=rnd(1,d?5:3);
    return {text:`Put ${p} ${e} in each basket`, basket:{g,p,e}, basketOnly:true, ans:g*p, hint:`Each basket gets exactly ${p}.`, reveal:`Each basket needs ${p}.`};
  },
  skip(d){

    if(t==='double'){ const n=rnd(1,d?12:6);
      return {text:`Double ${n} = {{slot}}`, vis:`<div class="vis">${grp(2,Math.min(n,10),pick(OBJ))}</div>`, ans:2*n, hint:`Double means two groups of ${n}: ${n} + ${n}`}; }
    const step={two:2,ten:10,five:5}[t];
    let s = t==='two' ? 2*rnd(0,d?7:2) : t==='ten' ? 10*rnd(0,d?4:3) : 5*rnd(0,4);
    if(d && t==='two' && Math.random()<.3) s++;          // odd starts: 1, 3, 5…
    if(d && t==='ten' && Math.random()<.25) s+=rnd(1,9);   // 3, 13, 23…
    const seq=Array.from({length:5},(_,i)=>s+i*step), i=rnd(1,4);
    return {text:seqText(seq,i), ans:seq[i], hint:`Count on in ${step}s: add ${step} each time.`};
  },
  add10(d){
    const e1=pick(OBJ2), e2=pick(OBJ2.filter(x=>x!==e1));
    const a=rnd(1,9), b=rnd(1,10-a), s=a+b;
    const vis=`<div class="vis">${objs(a,e1)}<span class="plus">+</span>${objs(b,e2)}</div>`;
    if(d && Math.random()<.4) return {text:`${a} + {{slot}} = ${s}`, vis:objs(s,e1), ans:b, hint:`What do you add to ${a} to make ${s}? Count on from ${a}.`};
    return {text:`${a} + ${b} = {{slot}}`, vis, ans:s, hint:`Count them all, or count on from ${Math.max(a,b)}.`};
  },
  add20(d){
    const e1=pick(OBJ2), e2=pick(OBJ2.filter(x=>x!==e1));
    let a,b;
    if(Math.random()<(d?.4:.7)){ const u=rnd(0,7); a=10+u; b=rnd(1,9-u); if(Math.random()<.25){a=10;b=rnd(1,9);} }
    else { a=rnd(6,9); b=rnd(11-a,9); }
    const s=a+b;
    const hint = (a<10 && s>10) ? `Make ten first: ${a} + ${10-a} = 10, then add ${b-(10-a)} more.` : `Keep the ${a>=10?'10':'big number'} and add the ones.`;
    return {text:`${a} + ${b} = {{slot}}`, vis:`<div class="vis">${objs(a,e1)}<span class="plus">+</span>${objs(b,e2)}</div>`, ans:s, hint};
  },
  add2d(d){
    const t1=rnd(1,8), t2=rnd(1,9-t1), u1=rnd(0,8), u2=rnd(0,9-u1);
    const a=t1*10+u1; let b;
    if(!d){ b = Math.random()<.5 ? t2*10 : Math.max(1,u2); } else b=t2*10+u2;
    if(b===0) b=10;
    const tens=Math.floor(b/10), ones=b%10;
    return {text:`${a} + ${b} = {{slot}}`, ans:a+b, extra:[10,-10],
      hint:`Tens: ${t1*10} + ${tens*10} = ${(t1+tens)*10}.${ones?` Ones: ${u1} + ${ones} = ${u1+ones}.`:''}`};
  },
  sub(d){
    const e=pick(OBJ), lv=rnd(0,d);
    let a,b;
    if(lv===0){ a=rnd(3,10); b=rnd(1,a-1); }
    else if(lv===1){ a=rnd(11,20); const u=a%10;
      const lo=Math.max(1,u+1), hi=Math.min(9,a-1);
      if(u>0 && (Math.random()<.5 || lo>hi)) b=rnd(1,u); else b=rnd(lo,hi); }
    else { const t1=rnd(2,9), u1=rnd(0,9); a=t1*10+u1; do{ b=rnd(0,t1-1)*10+rnd(0,u1); }while(b===0); }
    const ans=a-b;
    return {text:`${a} − ${b} = {{slot}}`, vis:a<=20?objs(a,e,b):'', ans, extra:[10,-10].slice(0,lv===2?2:0),
      hint: lv===2 ? `Take away the tens, then the ones.` : `Start at ${a} and count back ${b}.`};
  },
  times(d){

/* ---------- Round engine: questions, three answer modes, scoring ---------- */
let R=null; // current round
const PRAISE=['Brilliant!','You got it!','Super!','Yes! Well done!','Awesome, Oa!','Spot on!','Great job!'];
const TRYAGAIN=['Nearly! Try again.','Almost! Have another go.','Not quite. Check the hint!'];

function makeMathQ(topic){
  const d=levelOf(topic.id); let q;
  for(let k=0;k<10;k++){
    q=GEN[topic.id](d); q.ans=String(q.ans); q.kind='num';
    if(!q.basketOnly && !q.opts) q.opts=numOpts(+q.ans,4,q.extra||[]);
    q.sig=(q.say||'')+q.text+q.ans;
    if(!R.recent.includes(q.sig)) break;
  }
  R.recent.push(q.sig); if(R.recent.length>5) R.recent.shift();
  return q;
}
function makeBookQ(book,i){
  const [text,ans,opts]=book.quiz[i];
  return {text, ans, kind:'word', opts:shuffle(opts), vis:`<div class="bigpic vis">${book.cover.map(artItem).join('')}</div>`, hint:`Look at the story again. The word starts with “${ans[0]}”.`};
}
function startRound(kind,id){
  Snd.ensure();
  R={kind,id,i:0,score:0,first:0,streak:0,tries:0,locked:false,recent:[],bag:[],buf:'',
     n: kind==='math'?CONFIG.roundLen:3, before:TOPICS.map((_,i)=>topicOpen(i))};
  if(kind==='read') R.book=BOOKS.find(b=>b.id===id); else R.topic=TOPICS.find(t=>t.id===id);
  go('quiz');
}
function nextMode(q){
  if(q.basketOnly) return 'basket';
  if(!R.bag.length) R.bag=shuffle(['choose','type','drag']);
  return R.bag.pop();
}
function record(first){
  if(R.kind!=='math') return;
  const id=R.id; const h=hist(id).concat(first?1:0).slice(-10); S.hist[id]=h;
  const st=S.stats[id]||(S.stats[id]={c:0,n:0}); st.n++; if(first) st.c++;
}
function say(msg,mood){
  const b=$('#bubble'), f=$('#coachfig'); if(b) b.textContent=msg;
  if(f && mood) f.innerHTML=oa(mood);
}
function answer(ok){
  if(!R||R.locked) return;
  const q=R.q, slot=$('#slot');
  if(ok){
    R.locked=true;
    const first=R.tries===0, bonus=first?Math.min(5,R.streak):0, pts=first?10+bonus:5;
    R.score+=pts; S.points+=pts;
    if(first){ R.first++; R.streak++; } else R.streak=0;
    record(first); save(); updBar();
    Snd.play(first?'good':'ok');
    if(slot){ slot.textContent=q.basketOnly?'✓':q.ans; slot.classList.add('ok'); }
    say(pick(PRAISE)+' +'+pts+(bonus?` (streak bonus ${bonus})`:''),'cheer');
    const sk=$('#streak'); if(sk) sk.textContent='🔥 '+R.streak;
    setTimeout(nextQ, first?1200:1400);
  } else {
    R.tries++; R.streak=0;
    const sk=$('#streak'); if(sk) sk.textContent='🔥 0';
    if(R.tries>=2){
      R.locked=true; record(false); save(); Snd.play('no');
      if(slot){ slot.textContent=q.basketOnly?'':q.ans; slot.classList.add('bad'); }
      say(q.reveal||`The answer is ${q.ans}. On to the next one!`,'sad');
      const h=$('#hint'); if(h) h.hidden=true;
      setTimeout(nextQ,2600);
    } else {
      Snd.play('no'); say(pick(TRYAGAIN),'think');
      const h=$('#hint'); if(h){ h.textContent='💡 '+q.hint; h.hidden=false; }
      if(slot&&!q.basketOnly){ slot.classList.add('bad'); setTimeout(()=>slot.classList.remove('bad'),450); }
      if(R.onWrong) R.onWrong();
    }
  }
}
const submit = val => answer(String(val).toLowerCase()===R.q.ans.toLowerCase());

/* drag helper: works with mouse and touch via Pointer Events; a plain tap also counts */
function makeDrag(el,targets,onDrop,onTap){
  el.addEventListener('pointerdown',e=>{
    if(R&&R.locked) return;
    e.preventDefault(); Snd.resume();
    const sx=e.clientX, sy=e.clientY; let moved=false;
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    el.classList.add('dragging');
    const move=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>10) moved=true;
      el.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`;
      const t=hit(ev); targets().forEach(x=>x.classList.toggle('over',x===t));
    };
    const hit=ev=>targets().find(t=>{const b=t.getBoundingClientRect();return ev.clientX>b.left-14&&ev.clientX<b.right+14&&ev.clientY>b.top-14&&ev.clientY<b.bottom+14;})||null;
    const up=ev=>{
      el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
      try{ el.releasePointerCapture(e.pointerId); }catch(_){}
      el.classList.remove('dragging'); el.style.transform=''; targets().forEach(x=>x.classList.remove('over'));
      if(ev.type==='pointercancel') return;
      if(!moved){ if(onTap) onTap(el); return; }
      onDrop(el,hit(ev));
    };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  });
}

function showQuestion(){
  const q=R.q=(R.kind==='math'?makeMathQ(R.topic):makeBookQ(R.book,R.i));
  R.tries=0; R.locked=false; R.buf=''; R.mode=nextMode(q); R.onWrong=null;
  const dots=Array.from({length:R.n},(_,i)=>`<i class="${i<R.i?'done':i===R.i?'cur':''}"></i>`).join('');
  const slotHTML='<span class="slot" id="slot"></span>';
  const title = R.kind==='math' ? R.topic.name : R.book.title;
  const prompt = {choose:'Tap the right answer!',type:'Type your answer!',drag:'Drag the answer into the box!',basket:'Drag the things into the baskets!'}[R.mode];
  view(`<div class="quiz">
    <div class="qhead"><button class="btn alt back" data-a="${R.kind==='math'?'math':'read'}">◀</button>
      <div class="dots">${dots}</div><span id="streak">🔥 ${R.streak}</span><span>⭐ ${R.score}</span></div>
    <div class="card qcard">
      ${q.say?`<div class="qsay" data-a="say" data-v="${q.aloud||q.say}">🔊 ${q.say}</div>`:''}
      ${q.vis?`<div class="vis">${q.vis}</div>`:''}
      <div class="qtext">${q.text.replace('{{slot}}',slotHTML)}</div>
      <div class="hint" id="hint" hidden></div>
    </div>
    <div class="coach"><div class="fig" id="coachfig">${oa('happy')}</div><div class="bubble" id="bubble">${title}: ${prompt}</div></div>
    <div id="ans"></div>
  </div>`);
  const ans=$('#ans');
  if(R.mode==='choose') modeChoose(ans,q);
  else if(R.mode==='type') modeType(ans,q);
  else if(R.mode==='drag') modeDrag(ans,q);
  else modeBasket(ans,q);
}
function modeChoose(ans,q){
  ans.innerHTML=`<div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>`;
  ans.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(R.locked||b.classList.contains('wrong')) return;
    const ok=b.dataset.o.toLowerCase()===q.ans.toLowerCase();
    if(!ok) b.classList.add('wrong');
    submit(b.dataset.o);
  }));
}
function modeType(ans,q){
  const slot=$('#slot'); const isNum=q.kind==='num';
  ans.innerHTML = isNum
    ? `<div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}<button class="key del" data-k="del">⌫</button><button class="key go" data-k="go">✔</button></div>`
    : `<div class="kb">${'qwertyuiop asdfghjkl zxcvbnm'.split(' ').map(r=>r.split('').map(l=>`<button class="key" data-k="${l}">${l}</button>`).join('')+'<span style="flex-basis:100%"></span>').join('')}<button class="key del wide" data-k="del">⌫</button><button class="key go wide" data-k="go">✔ Go</button></div>`;
  const draw=()=>{ slot.textContent=R.buf; };
  R.typeKey=k=>{
    if(R.locked||R.mode!=='type') return;
    if(k==='del') R.buf=R.buf.slice(0,-1);
    else if(k==='go'){ if(!R.buf) return; const v=R.buf; R.buf=''; draw(); submit(v); return; }
    else if(R.buf.length<(isNum?3:12)) R.buf+=k;
    draw();
  };
  ans.querySelectorAll('.key').forEach(b=>b.addEventListener('click',()=>R.typeKey(b.dataset.k)));
}
function modeDrag(ans,q){

    (el,t)=>{ if(t) submit(el.dataset.o); },

}
function modeBasket(ans,q){
  const {g,p,e}=q.basket, total=g*p;
  ans.innerHTML=`<div class="baskets">${Array.from({length:g},(_,i)=>`<div class="basket" data-b="${i}"></div>`).join('')}</div>
    <div class="pool" id="pool" style="margin-top:14px">${Array.from({length:total},()=>`<span class="it">${e}</span>`).join('')}</div>`;
  const pool=$('#pool'), baskets=[...ans.querySelectorAll('.basket')];
  const check=()=>{
    if(pool.children.length) return;
    const ok=baskets.every(b=>b.children.length===p);
    answer(ok);
  };
  const wire=it=>makeDrag(it,()=>baskets,(el,t)=>{ if(t){ t.appendChild(el); Snd.play('click'); check(); } },
    el=>{ if(el.parentNode!==pool){ pool.appendChild(el); } });
  pool.querySelectorAll('.it').forEach(wire);
  R.onWrong=()=>{ [...ans.querySelectorAll('.it')].forEach(it=>pool.appendChild(it)); };
}
document.addEventListener('keydown',e=>{
  if(!R||cur!=='quiz'||R.mode!=='type'||R.locked||!R.typeKey) return;
  if(e.key==='Backspace') R.typeKey('del');
  else if(e.key==='Enter') R.typeKey('go');
  else if(R.q.kind==='num' ? /^[0-9]$/.test(e.key) : /^[a-zA-Z]$/.test(e.key)) R.typeKey(e.key.toLowerCase());
});
function nextQ(){ R.i++; if(R.i>=R.n) finishRound(); else showQuestion(); }

function finishRound(){
  const acc=R.first/R.n;
  if(R.kind==='read'){ R.score+=CONFIG.bookBonus; S.points+=CONFIG.bookBonus; S.booksDone[R.book.id]=true;
    R.book.words.forEach(w=>{ if(!S.words.includes(w)) S.words.push(w); }); }
  const factor = acc>=.9?1 : acc>=.7?.8 : .6;
  const final = Math.round(R.score*factor);
  const isBest = final>S.best; if(isBest) S.best=final;
  R.acc=acc; R.factor=factor; R.final=final; R.isBest=isBest;
  R.unlocked = R.kind==='math' ? TOPICS.filter((t,i)=>!R.before[i]&&topicOpen(i)) : [];
  save(); updBar();
  Snd.play(acc>=.7?'win':'lose');
  go('result');
}

function startArcade(){
  Snd.ensure(); Snd.start('arcade');
  const ar=$('#arena'), W=ar.clientWidth, H=ar.clientHeight;
  const ph=Math.max(110,Math.min(H*.34,200)), pw=ph*120/276, is=Math.max(44,Math.min(W*.075,66));
  arcade={ar,W,H,pw,ph,is,x:W/2,tx:null,dir:0,key:0,items:[],lives:3,score:0,coins:0,t:0,sp:.6,last:performance.now(),over:false,raf:0,moodT:0,
          py:H-H*.05-ph};
  const pl=$('#player'); pl.style.width=pw+'px'; pl.innerHTML=oa('happy');
  const setX=ev=>{ const r=ar.getBoundingClientRect(); arcade.tx=ev.clientX-r.left; arcade.dir=0; };
  ar.addEventListener('pointerdown',e=>{ Snd.resume(); try{ar.setPointerCapture(e.pointerId);}catch(_){} setX(e); });
  ar.addEventListener('pointermove',e=>{ if(e.buttons||e.pointerType==='touch') setX(e); });
  const hold=(id,d)=>{ const b=$(id); const on=e=>{e.preventDefault();Snd.resume();arcade.dir=d;arcade.tx=null;}, off=()=>{ if(arcade.dir===d) arcade.dir=0; };
    b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off); };
  hold('#bl',-1); hold('#br',1);
  updHud(); arcade.raf=requestAnimationFrame(tick);
}
function stopArcade(){
  if(!arcade) return; cancelAnimationFrame(arcade.raf); arcade=null; if(Snd.ctx) Snd.start('jingle');
}
const arcadeKeys=e=>{
  if(!arcade) return; const d=e.type==='keydown';
  if(['ArrowLeft','a','A'].includes(e.key)) arcade.key = d?-1:(arcade.key===-1?0:arcade.key);
  if(['ArrowRight','d','D'].includes(e.key)) arcade.key = d?1:(arcade.key===1?0:arcade.key);
  if(d && arcade.key) arcade.tx=null;
};
document.addEventListener('keydown',arcadeKeys); document.addEventListener('keyup',arcadeKeys);
function updHud(){
  const A=arcade; if(!A) return;
  $('#hLives').textContent='❤️'.repeat(A.lives)+'🖤'.repeat(3-A.lives);
  $('#hScore').textContent='⭐ '+A.score; $('#hCoins').innerHTML=coinSVG().replace('<svg','<svg style="height:1em;width:1em;vertical-align:-.12em"')+' '+A.coins;
}
function spawn(A,prog){
  const r=Math.random();
  const kind = r<.08?'pen' : r<.33?'coin' : r<.60?'low' : 'bad';
  const html = kind==='pen'?penSVG() : kind==='coin'?coinSVG() : kind==='low'?pick(GOOD_LOW) : pick(BAD);
  const el=document.createElement('div'); el.className='item';
  el.style.cssText=`width:${A.is}px;height:${A.is}px;font-size:${A.is*.8}px`; el.innerHTML=html;
  A.ar.appendChild(el);
  A.items.push({el,kind,x:rnd(A.is,A.W-A.is),y:-A.is,v:A.H*(.30+.30*prog)*(.9+Math.random()*.2)});
}
function floatPts(A,x,y,txt,bad){
  const p=document.createElement('div'); p.className='pts'+(bad?' bad':''); p.textContent=txt;
  p.style.left=(x-20)+'px'; p.style.top=y+'px'; A.ar.appendChild(p); setTimeout(()=>p.remove(),850);
}
function mood(A,m){ const pl=$('#player'); if(!pl) return; pl.innerHTML=oa(m); A.moodT=performance.now()+700; }
function tick(now){
  const A=arcade; if(!A||A.over) return;
  const dt=Math.min(.05,(now-A.last)/1000); A.last=now; A.t+=dt;
  const prog=Math.min(1,A.t/CONFIG.arcadeSeconds);
  // move
  const dir=A.dir||A.key;
  if(dir) A.x+=dir*A.W*.9*dt;
  else if(A.tx!=null){ const dx=A.tx-A.x, m=Math.min(Math.abs(dx),A.W*1.8*dt); A.x+=Math.sign(dx)*m; }
  A.x=Math.max(A.pw/2,Math.min(A.W-A.pw/2,A.x));
  $('#player').style.transform=`translate(${A.x-A.pw/2}px,${A.py}px)`;
  if(A.moodT && now>A.moodT){ A.moodT=0; $('#player').innerHTML=oa('happy'); }
  // spawn
  A.sp-=dt; if(A.sp<=0){ spawn(A,prog); A.sp=(1.0-.45*prog)*(.8+Math.random()*.4); }
  // items
  for(let i=A.items.length-1;i>=0;i--){
    const it=A.items[i]; it.y+=it.v*dt;
    it.el.style.transform=`translate(${it.x-A.is/2}px,${it.y}px)`;
    const caught = it.y+A.is*.9>A.py+A.ph*.08 && it.y<A.py+A.ph*.85 && Math.abs(it.x-A.x)<A.pw*.38+A.is*.35;
    if(caught){
      A.items.splice(i,1); it.el.remove();
      if(it.kind==='bad'){ A.lives--; Snd.play('hit'); floatPts(A,it.x,it.y,'Sugar spike! −❤️',true); mood(A,'sad');
        A.ar.classList.remove('shake'); void A.ar.offsetWidth; A.ar.classList.add('shake'); }
      else if(it.kind==='pen'){ A.score+=20; A.lives=Math.min(3,A.lives+1); Snd.play('pen'); floatPts(A,it.x,it.y,'+20 +❤️'); mood(A,'cheer'); }
      else if(it.kind==='coin'){ A.score+=5; A.coins++; Snd.play('coin'); floatPts(A,it.x,it.y,'+5'); }
      else { A.score+=10; Snd.play('low'); floatPts(A,it.x,it.y,'+10'); }
      updHud();
    } else if(it.y>A.H){ A.items.splice(i,1); it.el.remove(); }
  }
  $('#tb').style.transform=`scaleX(${Math.max(0,1-A.t/CONFIG.arcadeSeconds)})`;
  if(A.lives<=0 || A.t>=CONFIG.arcadeSeconds){ endArcade(); return; }
  A.raf=requestAnimationFrame(tick);
}
function endArcade(){
  const A=arcade; A.over=true;

  if(newBest) S.arcadeBest=A.score;
  S.points+=A.coins; save(); updBar(); Snd.play(win?'win':'lose');

function penHud(){
  const dots=P.res.map(r=>r==='goal'?'⚽':'❌').concat(Array(5-P.res.length).fill('⚪')).join(' ');
  $('#pKicks').textContent=dots; $('#pScore').textContent='⭐ '+P.score;
}
function startPen(){
  P={res:[],score:0,goals:0,busy:false};
  const me=P, pitch=$('#pitch');
  penHud();
  pitch.addEventListener('pointerdown',e=>{
    if(P!==me||me.busy) return;
    const pr=pitch.getBoundingClientRect();
    const px=e.clientX-pr.left, py=e.clientY-pr.top;
    if(py>pr.height*.7) return;                  // taps near the ball do nothing
    Snd.resume(); shoot(me,pr,px,py);
  });
}
function shoot(me,pr,px,py){
  me.busy=true;
  const gr=$('#goal').getBoundingClientRect(), g={l:gr.left-pr.left,t:gr.top-pr.top,w:gr.width,h:gr.height};
  const inGoal=px>g.l&&px<g.l+g.w&&py>g.t&&py<g.t+g.h;
  const lx=(px-g.l)/g.w, ly=(py-g.t)/g.h, zone=lx<.34?0:lx<.66?1:2, kz=rnd(0,2);
  const topCorner=inGoal&&ly<.3&&zone!==1;
  const outcome = !inGoal ? (py<g.t?'over':'wide') : (kz===zone&&!topCorner?'saved':'goal');
  const ball=$('#ball'), keeper=$('#keeper'), oaEl=$('#pOa');
  Snd.play('kick'); oaEl.classList.add('kick');
  // keeper dive
  const dx=([.17,.5,.83][kz]-.5)*g.w*.9, rot=[-70,0,70][kz], lift=kz===1?(outcome==='saved'&&ly<.4?-18:-6):(outcome==='saved'&&ly<.4?-22:-6);
  setTimeout(()=>{ keeper.style.transform=`translateX(calc(-50% + ${dx}px)) translateY(${lift}%) rotate(${rot}deg) ${kz===1?'scale(1.12)':''}`; },180);
  // ball flight
  let tx=px/pr.width*100, ty=py/pr.height*100, sc=.5;
  if(outcome==='over'){ ty-=10; sc=.38; } else if(outcome==='wide'){ sc=.45; }
  ball.style.left=tx+'%'; ball.style.top=ty+'%'; ball.style.transform=`translate(-50%,-50%) scale(${sc}) rotate(540deg)`;
  setTimeout(()=>{
    if(P!==me) return;
    if(outcome==='saved'){ ball.style.left=(tx+(zone-1)*9)+'%'; ball.style.top=(ty+22)+'%'; ball.style.transform=`translate(-50%,-50%) scale(.6) rotate(900deg)`; }
    let msg, pts=0;
    if(outcome==='goal'){ pts=10+(topCorner?5:0); msg=topCorner?'TOP CORNER! ⚽':'GOAL! ⚽'; Snd.play('goal'); me.goals++; }
    else { msg={saved:'Saved! 🧤',over:'Over the bar!',wide:'Wide!'}[outcome]; Snd.play('no'); }
    me.score+=pts; me.res.push(outcome==='goal'?'goal':'miss'); penHud();
    const m=$('#pmsg'); m.textContent=msg; m.className='show '+(outcome==='goal'?'good':'bad');
  },620);
  setTimeout(()=>{
    if(P!==me) return;
    if(me.res.length>=5){ endPen(me); return; }
    // reset for next kick
    $('#pmsg').className='';
    keeper.style.transition='none'; ball.style.transition='none';
    keeper.style.transform='translateX(-50%)'; ball.style.left='56%'; ball.style.top='82%'; ball.style.transform='translate(-50%,-50%)';
    oaEl.classList.remove('kick');
    void keeper.offsetWidth; keeper.style.transition=''; ball.style.transition='';
    me.busy=false;
  },1900);
}
function endPen(me){
  const best=me.score>S.penBest; if(best) S.penBest=me.score;
  S.points+=me.goals*2; save(); updBar(); Snd.play(me.goals>=3?'win':'lose');
  endOverlay(`${figHTML(me.goals>=3?'cheer':'happy')}<h1>${me.goals} goal${me.goals===1?'':'s'} out of 5!</h1>
    <div class="big-n" style="font-size:64px;color:var(--c1);font-weight:900">${me.score}</div><div class="line">Penalty score</div>
    ${best?'<div class="newhi">🏆 New best!</div>':`<div class="line">Best: ${S.penBest}</div>`}
    <div class="line">+${me.goals*2} points for your goals!</div>
    <div class="row">${tokens()>0?`<button class="btn" data-a="penGo">⚽ Again (🎟 ${tokens()})</button>`:''}<button class="btn alt" data-a="games">Games</button><button class="btn" data-a="math">🔢 Earn more</button></div>`);
}

/* ---------- Tic Tac Toe ---------- */
let T=null;
const TTT_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const TTT_MARK={X:'⚽',O:'🏀'};
const tttWinner=b=>{ for(const l of TTT_LINES) if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]]) return {m:b[l[0]],line:l}; return null; };
function tttMinimax(b,player){           // O is the computer: +1 good for O
  const w=tttWinner(b); if(w) return w.m==='O'?1:-1;
  const empty=b.map((v,i)=>v?-1:i).filter(i=>i>=0); if(!empty.length) return 0;
  let best=player==='O'?-2:2;
  for(const i of empty){ b[i]=player; const v=tttMinimax(b,player==='O'?'X':'O'); b[i]='';
    best=player==='O'?Math.max(best,v):Math.min(best,v); }
  return best;
}
function tttAI(b,level){
  const empty=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
  const finder=p=>empty.find(i=>{ b[i]=p; const w=tttWinner(b); b[i]=''; return !!w; });
  if(level==='genius'){
    let bestV=-2, moves=[];
    for(const i of empty){ b[i]='O'; const v=tttMinimax(b,'X'); b[i]=''; if(v>bestV){bestV=v;moves=[i];} else if(v===bestV) moves.push(i); }
    return pick(moves);
  }
  const smart = level==='tricky' ? .9 : .35;
  if(Math.random()<smart){
    const win=finder('O'); if(win!==undefined) return win;
    const block=finder('X'); if(block!==undefined) return block;
    if(level==='tricky' && empty.includes(4)) return 4;
  }
  return pick(empty);
}
function viewTttIntro(){

    start:'', best:`Wins ${w.w} · Draws ${w.d} · Losses ${w.l}`});

function viewTtt(){
  const me=T;
  view(`<div class="quiz" style="align-items:center">
    <div class="qhead" style="width:100%"><button class="btn alt back" data-a="tttIntro">◀</button><div class="coach" style="flex:1"><div class="fig" id="coachfig">${oa('happy')}</div><div class="bubble" id="bubble"></div></div></div>
    <div id="tboard">${Array.from({length:9},(_,i)=>`<button class="cell" data-a="tttPlay" data-v="${i}" id="c${i}"></button>`).join('')}</div></div>`);

function tttStatus(t,mood){ const b=$('#bubble'); if(b) b.textContent=t; if(mood){ const f=$('#coachfig'); if(f) f.innerHTML=oa(mood); } }
function tttDraw(){ T.board.forEach((v,i)=>{ const c=$('#c'+i); if(c) c.textContent=v?TTT_MARK[v]:''; }); }
function tttPlay(i){
  const me=T; if(!me||me.over||me.busy||me.board[i]) return;
  me.board[i]=me.turn; Snd.play('low'); tttDraw();
  if(tttCheck(me)) return;
  me.turn=me.turn==='X'?'O':'X';
  if(me.mode==='two'){ tttStatus(`Player ${me.turn==='X'?1:2} (${TTT_MARK[me.turn]}), your turn!`); return; }
  me.busy=true; tttStatus('Computer is thinking…','think');
  setTimeout(()=>{
    if(T!==me) return;
    const m=tttAI(me.board,me.mode); me.board[m]='O'; me.busy=false; Snd.play('coin'); tttDraw();
    if(tttCheck(me)) return;
    me.turn='X'; tttStatus('Your turn, Oa!','happy');
  },650);
}
function tttCheck(me){
  const w=tttWinner(me.board), full=me.board.every(v=>v);
  if(!w&&!full) return false;
  me.over=true;
  if(w) w.line.forEach(i=>$('#c'+i).classList.add('win'));
  let title, mood, pts=0;

  else if(w){ title='Computer wins. Try again!'; mood='sad'; pts=1; S.ttt.l++; }
  else { title='It’s a draw!'; mood='happy'; pts=3; S.ttt.d++; }
  S.points+=pts; save(); updBar();
  Snd.play(w&&(me.mode==='two'||w.m==='X')?'win':w?'lose':'ok');
  tttStatus(title+(pts?` +${pts} points`:''),mood);
  setTimeout(()=>{ if(T!==me) return;
    endOverlay(`${figHTML(mood)}<h1>${title}</h1>${pts?`<div class="line">+${pts} points</div>`:''}
      <div class="row">${tokens()>0?`<button class="btn" data-a="tttGo" data-v="${me.mode}">↻ Play again (🎟 ${tokens()})</button>`:''}<button class="btn alt" data-a="tttIntro">Back</button><button class="btn" data-a="math">🔢 Earn more</button></div>`); },1300);

}

/* ---------- Supa Pairs: memory match with the Supa Strikas ---------- */
const PAIRS_CAST = ['shakes','klaus','joe','matador','rasta','tiger','bo','oa','blok','shaw','eagle','rizo'];
const PAIRS_N = {easy:6, tricky:8, genius:10, two:8};
function viewPairsIntro(){
  const b=S.pairsBest;
  gameIntro({title:'Supa Pairs', body:`<div class="line">Turn over two cards at a time and find the matching players!</div>
    <div class="row">${tokens()>0?['easy:Easy','tricky:Tricky','genius:Genius','two:2 Players'].map(x=>{const [v,l]=x.split(':'); return `<button class="btn" data-a="pairsGo" data-v="${v}">${l}</button>`;}).join(''):''}</div>
    <div class="line" style="font-size:16px">Each game uses 1 token (you have ${tokens()}).</div>`,
    start:'', best:`Fewest turns: Easy ${b.easy||'–'} · Tricky ${b.tricky||'–'} · Genius ${b.genius||'–'}`});
}
function viewPairs(){
  const mode=PAIRS_N[gArg]?gArg:'easy', n=PAIRS_N[mode], ids=shuffle(PAIRS_CAST).slice(0,n), deck=shuffle(ids.concat(ids));
  view(gameShell('<span class="chip" id="gA"></span><span class="chip" id="gB"></span>', deck.map((_,i)=>`<div class="pcard" data-i="${i}"><div class="back">⚽</div></div>`).join('')));
  const area=$('#garea'), els=[].slice.call(area.querySelectorAll('.pcard')), face={};
  ids.forEach(id=>{ face[id]=`<div class="face">${id==='oa'?oa('happy'):player(id)}<b>${castName(id)}</b></div>`; });
  const me=G={mode,n,deck,els,face,up:[],done:0,turns:0,who:0,sc:[0,0],busy:false};
  me.layout=()=>{   // the grid shape that gives the biggest 3:4 cards
    const W=area.clientWidth, H=area.clientHeight, k=deck.length, gap=10; let best=null;
    for(let cols=2;cols<=k;cols++){ if(k%cols) continue; const rows=k/cols, w=Math.min((W-gap*(cols+1))/cols,(H-gap*(rows+1))/rows*.75);
      if(!best||w>best.w) best={cols,rows,w}; }
    const {cols,rows,w}=best, h=w/.75, ox=(W-cols*w-(cols-1)*gap)/2, oy=(H-rows*h-(rows-1)*gap)/2;
    els.forEach((el,i)=>{ place(el,ox+(i%cols)*(w+gap),oy+Math.floor(i/cols)*(h+gap),w,h); el.style.fontSize=Math.round(w*.13)+'px'; });
  };
  me.layout(); pairsHud(me);
  area.addEventListener('pointerdown',e=>{ const el=e.target.closest('.pcard'); if(el) pairsTap(me,+el.dataset.i); });
}
function pairsHud(me){
  if(me.mode==='two'){ $('#gA').textContent=`${me.who?'':'👉 '}Player 1: ${me.sc[0]}`; $('#gB').textContent=`${me.who?'👉 ':''}Player 2: ${me.sc[1]}`; }
  else { $('#gA').textContent=`Pairs ${me.done} / ${me.n}`; $('#gB').textContent=`Turns ${me.turns}`; }
}
function pairsFlip(me,i,show){
  const el=me.els[i]; el.classList.add('flip');
  setTimeout(()=>{ if(G!==me) return; el.innerHTML=show?me.face[me.deck[i]]:'<div class="back">⚽</div>'; el.classList.toggle('up',show); el.classList.remove('flip'); },150);
}
function pairsTap(me,i){
  if(G!==me||me.busy||me.up.indexOf(i)>=0||me.els[i].classList.contains('done')) return;
  Snd.resume(); Snd.play('click'); pairsFlip(me,i,true); me.up.push(i);
  if(me.up.length<2) return;
  me.busy=true; me.turns++;
  const a=me.up[0], b=me.up[1], hit=me.deck[a]===me.deck[b];
  me.tm=setTimeout(()=>{
    if(G!==me) return;
    if(hit){ me.els[a].classList.add('done'); me.els[b].classList.add('done'); me.done++; me.sc[me.who]++; Snd.play('good'); }   // a match keeps the turn
    else { pairsFlip(me,a,false); pairsFlip(me,b,false); if(me.mode==='two') me.who=1-me.who; }
    me.up=[]; me.busy=false; pairsHud(me);
    if(me.done===me.n){ me.busy=true; me.tm=setTimeout(()=>{ if(G===me) pairsEnd(me); },700); }
  }, hit?500:1100);
}
function pairsEnd(me){
  let title, pts=0, extra;
  if(me.mode==='two'){ const a=me.sc[0], b=me.sc[1]; title=a===b?'It’s a draw!':`Player ${a>b?1:2} wins!`; extra=`<div class="line">Player 1: ${a} pairs · Player 2: ${b} pairs</div>`; }
  else {
    const prev=S.pairsBest[me.mode], isBest=!prev||me.turns<prev; if(isBest) S.pairsBest[me.mode]=me.turns;
    pts={easy:5,tricky:8,genius:12}[me.mode]+(me.turns<=Math.round(me.n*1.6)?5:0);
    title=`All ${me.n} pairs in ${me.turns} turns!`; extra=bestLine(isBest,prev,' turns')+`<div class="line">+${pts} points</div>`;
  }
  S.points+=pts; save(); updBar(); Snd.play('win');
  endOverlay(`${figHTML('cheer')}<h1>${title}</h1>${extra}${againRow('pairsGo',me.mode,'pairsIntro')}`);
}

function viewKeepy(){
  view(gameShell('<span class="chip" id="gA"></span><span class="chip" id="gB"></span>',
    `<div class="koa">${oa('happy')}</div><div class="kball">${ballSVG()}</div><div class="kmsg" id="kmsg">Tap the ball!</div>`,'grass'));
  const area=$('#garea'), ball=area.querySelector('.kball');
  const me=G={area,ball,balls:3,run:0,best:0,total:0,wait:true,x:0,y:0,vx:0,vy:0,rot:0,last:performance.now(),lastTap:0};
  me.layout=()=>{ me.W=area.clientWidth; me.H=area.clientHeight; me.r=Math.max(30,Math.min(me.W,me.H)*.08); me.g=me.H*1.4; me.floor=me.H*.82;
    ball.style.width=ball.style.height=2*me.r+'px'; if(me.wait){ me.x=me.W/2; me.y=me.H*.4; } };

    if(dx*dx+dy*dy>Math.pow(me.r*1.9,2) || now-me.lastTap<140) return;   // a generous hit area for small fingers
    me.lastTap=now; me.wait=false; $('#kmsg').textContent='';
    me.vy=-Math.sqrt(me.g*me.H); me.vx=Math.max(-1,Math.min(1,dx/me.r))*me.W*.28+(Math.random()-.5)*me.W*.08;
    me.run++; me.total++; if(me.run>me.best) me.best=me.run;
    Snd.play('kick'); floatPts({ar:area},me.x,me.y-me.r*2,String(me.run));
    if(me.run%10===0){ me.g*=1.06; Snd.play('coin'); area.querySelector('.koa').innerHTML=oa('cheer'); }
    keepyHud(me);
  });
  me.raf=requestAnimationFrame(t=>keepyTick(me,t));
}
function keepyHud(me){ $('#gA').textContent='⚽'.repeat(me.balls)+'⚪'.repeat(3-me.balls); $('#gB').textContent=`In a row: ${me.run} · Best: ${me.best}`; }
function keepyTick(me,now){
  if(G!==me||me.over) return;
  const dt=Math.min(.04,(now-me.last)/1000); me.last=now;
  if(!me.wait){
    me.vy+=me.g*dt; me.x+=me.vx*dt; me.y+=me.vy*dt; me.rot+=me.vx*dt*1.5;
    if(me.x<me.r){ me.x=me.r; me.vx=Math.abs(me.vx)*.8; }
    if(me.x>me.W-me.r){ me.x=me.W-me.r; me.vx=-Math.abs(me.vx)*.8; }
    if(me.y<me.r){ me.y=me.r; me.vy=Math.abs(me.vy)*.3; }
    if(me.y+me.r>=me.floor) keepyDrop(me);
  }
  me.ball.style.transform=`translate(${me.x-me.r}px,${me.y-me.r}px) rotate(${me.rot}deg)`;
  me.raf=requestAnimationFrame(t=>keepyTick(me,t));
}
function keepyDrop(me){
  const fig=me.area.querySelector('.koa'), m=$('#kmsg');
  me.balls--; me.y=me.floor-me.r; me.wait=true; me.g=me.H*1.4; Snd.play('no'); fig.innerHTML=oa('sad');
  m.textContent=me.run>1?`${me.run} in a row!`:'Oops!'; me.run=0; keepyHud(me);
  if(me.balls<=0){ me.over=true; me.tm=setTimeout(()=>{ if(G===me) keepyEnd(me); },800); return; }
  me.tm=setTimeout(()=>{ if(G!==me||!me.wait) return; me.x=me.W/2; me.y=me.H*.4; m.textContent='Tap the ball!'; fig.innerHTML=oa('happy'); },1000);
}
function keepyEnd(me){
  const isBest=me.best>S.keepyBest; if(isBest) S.keepyBest=me.best;
  const pts=Math.min(15,Math.floor(me.total/3));
  S.points+=pts; save(); updBar(); Snd.play(me.best>=10?'win':'ok');
  endOverlay(`${figHTML('cheer')}<h1>${me.best} kick${me.best===1?'':'s'} in a row!</h1>${bestLine(isBest,S.keepyBest)}
    <div class="line">${me.total} kicks altogether: +${pts} points</div>${againRow('keepyGo','','keepyIntro')}`);
}

/* ---------- Red Card!: tap the rivals in black, not the Supa Strikas in red ---------- */
const RED_SECS = 40;
const RED_TEAM = ['shakes','joe','matador','rasta','tiger','klaus','blok'];
function viewRedIntro(){
  gameIntro({title:'Red Card!', body:`<div class="line">Players pop up out of the holes. Tap the ones in <b>black shirts</b> to show them a red card 🟥<br>Don’t tap your Supa Strikas teammates in red!</div>
    <div class="row" style="align-items:flex-end"><div class="sfig">${player('rival')}</div><div class="sfig">${player('skarra')}</div><span style="font-size:50px">🟥</span></div>`,
    start:startBtn('redGo','🟥 Start'), best:`Best: ${S.redBest}`});
}
function viewRed(){
  view(gameShell('<span class="chip" id="gA">⭐ 0</span><div class="timebar"><i id="tb"></i></div>',
    Array.from({length:9},(_,i)=>`<div class="ghole" id="gh${i}"></div><div class="gcell" id="gc${i}" data-i="${i}"><div class="gmole" id="gm${i}"></div></div>`).join(''),'pitch'));
  const area=$('#garea');
  const me=G={area,score:0,cards:0,oops:0,t:0,next:.6,holes:[null,null,null,null,null,null,null,null,null],last:performance.now()};
  me.layout=()=>{ const cw=area.clientWidth/3, ch=area.clientHeight/3;
    for(let i=0;i<9;i++){ const x=(i%3)*cw, y=Math.floor(i/3)*ch;
      place($('#gh'+i),x+cw*.14,y+ch*.82,cw*.72,ch*.16); place($('#gc'+i),x,y+ch*.04,cw,ch*.86); } };
  me.layout();
  area.addEventListener('pointerdown',e=>{
    if(G!==me||me.over) return;
    const c=e.target.closest('.gcell'); if(!c) return;
    const i=+c.dataset.i, h=me.holes[i]; if(!h||h.gone||h.hit) return;
    const r=area.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    h.hit=true; h.until=me.t+.45;
    if(h.rival){ me.score+=10; me.cards++; Snd.play('coin'); floatPts({ar:area},x,y-40,'+10'); }
    else { me.score=Math.max(0,me.score-10); me.oops++; Snd.play('no'); floatPts({ar:area},x,y-40,`Oops! ${castName(h.id)}!`,true); }
    $('#gm'+i).innerHTML=player(h.id,'sad')+`<div class="gcard">${h.rival?'🟥':'❌'}</div>`;
    $('#gA').textContent='⭐ '+me.score;
  });
  me.raf=requestAnimationFrame(t=>redTick(me,t));
}
function redTick(me,now){
  if(G!==me||me.over) return;
  const dt=Math.min(.05,(now-me.last)/1000); me.last=now; me.t+=dt;
  const prog=Math.min(1,me.t/RED_SECS);
  me.next-=dt; if(me.next<=0){ redPop(me,prog); me.next=(1-.5*prog)*(.7+Math.random()*.5); }
  me.holes.forEach((h,i)=>{ if(h && me.t>h.until){ if(h.gone) me.holes[i]=null; else redHide(me,i); } });
  $('#tb').style.transform=`scaleX(${Math.max(0,1-prog)})`;
  if(prog>=1){ me.over=true; me.holes.forEach((h,i)=>{ if(h) redHide(me,i); }); me.tm=setTimeout(()=>{ if(G===me) redEnd(me); },600); return; }
  me.raf=requestAnimationFrame(t=>redTick(me,t));
}
function redPop(me,prog){
  const free=[]; me.holes.forEach((h,i)=>{ if(!h) free.push(i); }); if(!free.length) return;
  const i=pick(free), rival=Math.random()<.68, id=rival?pick(['rival','skarra']):pick(RED_TEAM);
  me.holes[i]={rival,id,until:me.t+1.5-.7*prog,hit:false};
  const m=$('#gm'+i); m.innerHTML=player(id); m.className='gmole up';
}
function redHide(me,i){ me.holes[i]={gone:true,until:me.t+.3}; $('#gm'+i).className='gmole'; }  // short gap before the hole is used again
function redEnd(me){
  const isBest=me.score>S.redBest; if(isBest) S.redBest=me.score;
  const pts=Math.min(15,Math.round(me.score/20));
  S.points+=pts; save(); updBar(); Snd.play(me.cards>=10?'win':'ok');
  endOverlay(`${figHTML(me.cards>=10?'cheer':'happy')}<h1>${me.cards} red card${me.cards===1?'':'s'}!</h1>
    <div class="big-n" style="font-size:64px;color:var(--c1);font-weight:900">${me.score}</div>${bestLine(isBest,S.redBest)}
    ${me.oops?`<div class="line">Oops, you carded ${me.oops} teammate${me.oops===1?'':'s'}.</div>`:''}<div class="line">+${pts} points</div>${againRow('redGo','','redIntro')}`);
}

/* ---------- Copy the Coach: watch the pattern, then tap it back ---------- */
const PADS = [{c:'#ff5a5a',e:'⚽'},{c:'#3b8dff',e:'👟'},{c:'#ffc93c',e:'🧤'},{c:'#4cc552',e:'🏆'}];
function viewSimonIntro(){
  gameIntro({title:'Copy the Coach', mood:'think', body:`<div class="line">Coach Ledige lights up the buttons. Watch and listen, then tap them in the same order!<br>Each time you get it right, the pattern gets one longer. You get one second chance.</div>`,
    start:startBtn('simonGo','👀 Start'), best:`Longest pattern: ${S.simonBest}`});
}
function viewSimon(){
  view(`<div class="pen"><div class="coach"><div class="sfig" style="height:110px">${player('coach')}</div><div class="bubble" id="bubble">Watch me!</div></div>
    <div id="garea" class="garea" style="background:var(--c3)">${PADS.map((p,i)=>`<div class="spad" id="sp${i}" data-i="${i}" style="background:${p.c}">${p.e}</div>`).join('')}</div></div>`);
  const area=$('#garea'), me=G={seq:[],pos:0,turn:false,miss:0,best:0};
  me.layout=()=>{ const W=area.clientWidth, H=area.clientHeight, gap=18, s=Math.min((W-gap*3)/2,(H-gap*3)/2), ox=(W-2*s-gap)/2, oy=(H-2*s-gap)/2;
    PADS.forEach((_,i)=>{ const el=$('#sp'+i); place(el,ox+(i%2)*(s+gap),oy+Math.floor(i/2)*(s+gap),s,s); el.style.fontSize=Math.round(s*.4)+'px'; }); };
  me.layout();
  area.addEventListener('pointerdown',e=>{ const p=e.target.closest('.spad'); if(p) simonTap(me,+p.dataset.i); });
  me.tm=setTimeout(()=>simonNext(me),800);
}
const simonSay = t => { const b=$('#bubble'); if(b) b.textContent=t; };
function simonLight(i,ms){ const p=$('#sp'+i); if(!p) return; Snd.play('p'+i); p.classList.add('lit'); setTimeout(()=>p.classList.remove('lit'),ms); }
function simonNext(me){ if(G!==me) return; me.seq.push(rnd(0,3)); simonShow(me); }
function simonShow(me){
  me.turn=false; me.pos=0; simonSay('Watch me!');
  const gap=Math.max(380,700-me.seq.length*30);
  me.seq.forEach((p,k)=>setTimeout(()=>{ if(G===me) simonLight(p,gap*.6); },400+k*gap));
  me.tm=setTimeout(()=>{ if(G!==me) return; me.turn=true; simonSay(`Your turn! Copy ${me.seq.length}.`); },400+me.seq.length*gap);
}
function simonTap(me,i){
  if(G!==me||!me.turn) return;
  Snd.resume(); simonLight(i,250);
  if(i!==me.seq[me.pos]){
    me.turn=false; me.miss++;
    if(me.miss>=2){ me.over=true; Snd.play('lose'); simonSay('Oh no!'); me.tm=setTimeout(()=>{ if(G===me) simonEnd(me); },900); return; }
    Snd.play('no'); simonSay('Not quite! Watch again.'); me.tm=setTimeout(()=>{ if(G===me) simonShow(me); },1200); return;
  }
  if(++me.pos<me.seq.length) return;
  me.turn=false; me.best=me.seq.length; simonSay(pick(PRAISE));
  setTimeout(()=>{ if(G===me) Snd.play('good'); },250);
  me.tm=setTimeout(()=>simonNext(me),1200);
}
function simonEnd(me){
  const isBest=me.best>S.simonBest; if(isBest) S.simonBest=me.best;
  const pts=Math.min(15,me.best);
  S.points+=pts; save(); updBar();
  endOverlay(`${figHTML(me.best>=5?'cheer':'happy')}<h1>You copied ${me.best} in a row!</h1>${bestLine(isBest,S.simonBest)}
    <div class="line">+${pts} points</div>${againRow('simonGo','','simonIntro')}`);
}

/* ---------- Modal + parent area ---------- */
function modal(html){ const m=$('#dlghost'); m.innerHTML=`<div class="gamedlg" data-close="1"><div class="card dlgcard">${html}</div></div>`; m.hidden=false; }
function closeModal(){ const m=$('#dlghost'); m.hidden=true; m.innerHTML=''; }
function parentGate(){
  const a=rnd(6,9), b=rnd(6,9); window.__gate=a+b;
  modal(`<h2 style="color:var(--ink);text-shadow:none">For grown-ups</h2><div class="line">What is ${a} + ${b}?</div>
    <input class="num" id="gate" type="tel" inputmode="numeric" autocomplete="off"><div class="row"><button class="btn" data-a="gateok">OK</button><button class="btn alt" data-a="close">Cancel</button></div>`);
  setTimeout(()=>{ const g=$('#gate'); if(g) g.focus(); },50);
}
function parentPanel(){
  modal(`<h2 style="color:var(--ink);text-shadow:none">Grown-ups</h2>
    <label class="toggle"><input type="checkbox" id="ua" ${S.unlockAll?'checked':''} data-a="unlockall"> Unlock all topics and books</label>
    <div class="line">Points: ${S.points} · Tokens: ${tokens()}</div>
    <div class="row"><button class="btn alt" data-a="addtoken">+1 token</button><button class="btn alt" data-a="reset">Reset all progress</button></div>
    <button class="btn" data-a="close">Done</button>
    <div class="line" style="font-size:15px;opacity:.7">The arcade is a game and is not medical advice.</div>`);
}
function themePicker(){
  modal(`<h2 style="color:var(--ink);text-shadow:none">Pick a colour</h2><div class="swatches">${['purple','teal','blue','green'].map(t=>`<button class="sw ${t}" data-a="setTheme" data-v="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`);
}

/* ---------- Actions (one delegated click handler) ---------- */
const ACT = {
  home:()=>go('home'), math:()=>go('math'), read:()=>go('read'), words:()=>go('words'),
  arcadeIntro:()=>go('arcadeIntro'), games:()=>go('games'),
  penIntro:()=>go('penIntro'), penGo:()=>{ if(!spendToken()) return; go('pen'); },
  pairsIntro:()=>go('pairsIntro'), pairsGo:d=>{ if(!spendToken()) return; gArg=d.v; go('pairs'); },
  keepyIntro:()=>go('keepyIntro'), keepyGo:()=>{ if(!spendToken()) return; go('keepy'); },
  redIntro:()=>go('redIntro'), redGo:()=>{ if(!spendToken()) return; go('red'); },
  simonIntro:()=>go('simonIntro'), simonGo:()=>{ if(!spendToken()) return; go('simon'); },
  tttIntro:()=>go('tttIntro'), tttGo:d=>{ if(!spendToken()) return; T={board:Array(9).fill(''),turn:'X',mode:d.v,over:false,busy:false}; go('ttt'); }, tttPlay:d=>tttPlay(+d.v),
  arcadeGo:()=>{ if(tokens()<1) return; const e=$('#arcadeEnd'); if(e) e.remove(); S.spent++; save(); go('arcade'); },
  topic:d=>startRound('math',d.v), locked:()=>{ Snd.play('no'); },
  book:d=>go('book',{bi:+d.v,pi:0}),
  pagenext:()=>{ rd.pi++; go('book'); }, pageprev:()=>{ rd.pi--; go('book'); },
  readaloud:()=>speak(BOOKS[rd.bi].pages[rd.pi][0].replace(/[“”]/g,'')),
  say:d=>speak(d.v),
  quizstart:()=>startRound('read',BOOKS[rd.bi].id),
  theme:()=>themePicker(),
  setTheme:d=>{ S.theme=d.v; document.documentElement.dataset.theme=d.v; save(); closeModal(); if(cur==='welcome') go('home'); },
  mute:()=>{ Snd.resume(); Snd.setMute(!S.mute); updBar(); },
  parent:()=>parentGate(),
  gateok:()=>{ if(+$('#gate').value===window.__gate) parentPanel(); else { closeModal(); } },
  unlockall:()=>{ S.unlockAll=$('#ua').checked; save(); },
  addtoken:()=>{ S.points+=CONFIG.tokenCost; save(); updBar(); parentPanel(); },
  reset:()=>{ if(confirm('Reset ALL of Oa\'s progress? This cannot be undone.')){ const th=S.theme; S=clone(DEF); S.theme=th; save(); closeModal(); go('home'); } },
  close:()=>closeModal()
};
document.body.addEventListener('click',e=>{
  if(e.target.dataset && e.target.dataset.close && e.target===e.target) { closeModal(); return; }
  const b=e.target.closest('[data-a]'); if(!b) return;
  Snd.ensure(); Snd.play('click');
  const f=ACT[b.dataset.a]; if(f) f(b.dataset,b);
});
document.addEventListener('pointerdown',()=>Snd.ensure(),{passive:true});
document.addEventListener('visibilitychange',()=>{ if(!Snd.ctx) return; if(document.hidden) Snd.ctx.suspend(); else Snd.ctx.resume(); });
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- Boot ---------- */
document.documentElement.dataset.theme=S.theme||'purple';
window.EDU={S:()=>S,GEN,TOPICS,BOOKS,numOpts,oa,go,CONFIG,startRound,R:()=>R};
go(S.theme?'home':'welcome');
/* offline support: only when served over http(s), never from a saved file */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
